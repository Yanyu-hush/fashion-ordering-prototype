<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>序章订货 - 确认订单</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main class="screen">
      <div class="status"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div>
      <header class="topbar">
        <a class="back-btn" href="cart.html">‹</a>
        <div><p class="eyebrow">CHECKOUT</p><h1 class="page-title">确认订单</h1></div>
        <span></span>
      </header>
      <section class="form-card">
        <h3>采购门店</h3>
        <div class="form-line"><span>门店</span><strong>序章女装 · 静安店 ›</strong></div>
        <div class="form-line"><span>采购人</span><strong>林女士 138****2068</strong></div>
      </section>
      <section class="form-card">
        <h3>收货信息</h3>
        <div class="form-line"><span>地址</span><strong>上海市静安区南京西路 688 号 ›</strong></div>
        <div class="form-line"><span>配送</span><strong>供应商物流 · 预计 3–5 天 ›</strong></div>
      </section>
      <section class="form-card">
        <h3>商品清单</h3>
        <div class="form-line"><span>羊毛混纺收腰大衣</span><strong>12 件</strong></div>
        <div class="form-line"><span>柔绒 V 领针织开衫</span><strong>10 件</strong></div>
        <div class="form-line"><span>合计</span><strong>2 款 · 22 件</strong></div>
      </section>
      <section class="form-card">
        <h3>采购备注</h3>
        <div class="form-line"><span>备注</span><strong>请按款分箱，附装箱清单 ›</strong></div>
      </section>
      <section class="summary-card">
        <div class="summary-row"><span>商品金额</span><strong>¥3,208</strong></div>
        <div class="summary-row"><span>配送费用</span><strong>¥0</strong></div>
        <div class="summary-row"><span>订货优惠</span><strong style="color:#647563">-¥80</strong></div>
        <div class="summary-row total"><span>应付金额</span><strong>¥3,128</strong></div>
      </section>
      <section class="section">
        <div class="reorder"><div><strong>提交即代表确认库存与批发规则</strong><span>订单提交后由供应商业务员审核</span></div></div>
      </section>
    </main>
    <div class="sticky-bar">
      <div class="sticky-total"><span>2 款 · 22 件</span><strong>¥3,128</strong></div>
      <a class="primary-btn" href="home.html">提交订单</a>
    </div>
  </div>
</body>
</html>
