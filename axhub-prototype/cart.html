<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>序章订货 - 订货车</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main class="screen">
      <div class="status"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div>
      <header class="topbar">
        <a class="back-btn" href="home.html">‹</a>
        <div><p class="eyebrow">ORDER BAG</p><h1 class="page-title">订货车</h1></div>
        <span class="text-link">管理</span>
      </header>
      <section class="cart-list">
        <p class="eyebrow">秋季通勤系列 · 2 款</p>
        <article class="cart-item">
          <img src="assets/coat.png" alt="羊毛混纺收腰大衣">
          <div>
            <h3>羊毛混纺收腰大衣</h3>
            <span class="style-no">AW26-C013 · ¥169 / 件</span>
            <div class="allocation">酒红：S×3 / M×5 / L×4<br>合计 12 件 · 小计 ¥2,028</div>
            <div class="notice">酒红 L 码库存较低，仅剩 6 件</div>
          </div>
        </article>
        <article class="cart-item">
          <img src="assets/knit.png" alt="柔绒针织开衫">
          <div>
            <h3>柔绒 V 领针织开衫</h3>
            <span class="style-no">AW26-K028 · ¥118 / 件</span>
            <div class="allocation">燕麦：S×2 / M×4 / L×4<br>合计 10 件 · 小计 ¥1,180</div>
            <div class="next-tier">已满足 10 件起订条件</div>
          </div>
        </article>
      </section>
      <section class="summary-card">
        <div class="summary-row"><span>商品款数</span><strong>2 款</strong></div>
        <div class="summary-row"><span>商品件数</span><strong>22 件</strong></div>
        <div class="summary-row"><span>商品金额</span><strong>¥3,208</strong></div>
        <div class="summary-row total"><span>预计合计</span><strong>¥3,208</strong></div>
      </section>
      <section class="section"><a class="reorder" href="catalog.html"><div><strong>继续选款</strong><span>本系列还有 30 款商品可订</span></div><b>→</b></a></section>
    </main>
    <div class="sticky-bar">
      <div class="sticky-total"><span>共 22 件</span><strong>¥3,208</strong></div>
      <a class="primary-btn" href="checkout.html">确认订货</a>
    </div>
  </div>
</body>
</html>
