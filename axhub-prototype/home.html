<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>序章订货 - 首页</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main class="screen">
      <div class="status"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div>
      <header class="topbar">
        <div>
          <p class="eyebrow">AUTUMN 2026</p>
          <div class="brand">序章订货</div>
        </div>
        <a class="icon-btn" href="cart.html" aria-label="订货车">袋</a>
      </header>

      <div class="search">⌕ <span>搜索商品名称 / 货号</span></div>

      <section class="hero">
        <img src="assets/coat.png" alt="秋季通勤系列">
        <div class="hero-copy">
          <p>NEW SEASON EDIT</p>
          <h1>秋季<br>通勤系列</h1>
          <p>利落廓形与低饱和色彩，为都市门店精选新一季核心款。</p>
          <a class="hero-tag" href="catalog.html">查看系列 →</a>
        </div>
      </section>

      <section class="section">
        <div class="chips">
          <a class="chip active" href="catalog.html">新品</a>
          <a class="chip" href="catalog.html">热销</a>
          <a class="chip" href="catalog.html">外套</a>
          <a class="chip" href="catalog.html">针织</a>
          <a class="chip" href="catalog.html">裙装</a>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>本周新品</h2>
          <a href="catalog.html">查看全部 →</a>
        </div>
        <div class="product-grid">
          <a class="product-card" href="product.html">
            <div class="product-image">
              <img src="assets/coat.png" alt="酒红羊毛收腰大衣">
              <span class="badge">NEW</span>
              <span class="stock-badge">库存充足</span>
            </div>
            <h3>羊毛混纺收腰大衣</h3>
            <div class="product-meta"><span class="price"><small>¥</small>169</span><span class="minimum">12件起订</span></div>
          </a>
          <a class="product-card" href="product.html">
            <div class="product-image">
              <img src="assets/knit.png" alt="燕麦针织开衫">
              <span class="badge">TOP</span>
            </div>
            <h3>柔绒 V 领针织开衫</h3>
            <div class="product-meta"><span class="price"><small>¥</small>118</span><span class="minimum">10件起订</span></div>
          </a>
        </div>
      </section>

      <section class="section">
        <a class="reorder" href="catalog.html">
          <div><strong>快速补货</strong><span>根据上次订单，一键找到 8 款热销商品</span></div>
          <b>→</b>
        </a>
      </section>
    </main>
    <nav class="bottom-nav">
      <a class="nav-item active" href="home.html"><b>⌂</b><span>首页</span></a>
      <a class="nav-item" href="catalog.html"><b>▦</b><span>分类</span></a>
      <a class="nav-item" href="cart.html"><b>▱</b><span>订货车</span></a>
      <a class="nav-item" href="profile.html"><b>○</b><span>我的</span></a>
    </nav>
  </div>
</body>
</html>
