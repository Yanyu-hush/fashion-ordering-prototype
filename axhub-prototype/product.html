<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>序章订货 - 配码</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main class="screen">
      <div class="status"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div>
      <header class="topbar">
        <a class="back-btn" href="home.html">‹</a>
        <h1 class="page-title">商品详情</h1>
        <a class="icon-btn" href="cart.html">袋</a>
      </header>
      <div class="detail-image"><img src="assets/coat.png" alt="羊毛混纺收腰大衣"></div>
      <section class="detail-copy">
        <p class="eyebrow">AUTUMN ESSENTIAL</p>
        <h1>羊毛混纺收腰大衣</h1>
        <span class="style-no">货号 AW26-C013 · 羊毛 52% · 微廓形收腰</span>
        <div class="detail-price"><span class="price"><small>批发价 ¥</small>169</span><span class="minimum">12 件起订</span></div>
      </section>
      <section class="tier-box">
        <div class="tier"><strong>¥169</strong><span>12–29 件</span></div>
        <div class="tier"><strong>¥155</strong><span>30–59 件</span></div>
        <div class="tier"><strong>¥142</strong><span>60 件以上</span></div>
      </section>
      <section class="matrix-card">
        <div class="matrix-title"><strong>颜色 × 尺码</strong><span class="text-link">批量填写</span></div>
        <div class="color-tabs"><span class="color-tab active">酒红</span><span class="color-tab">炭黑</span><span class="color-tab">燕麦</span></div>
        <div class="matrix">
          <div class="head">尺码</div><div class="head">S</div><div class="head">M</div><div class="head">L</div><div class="head">XL</div>
          <div class="head">库存</div><div>18</div><div>11</div><div class="low">余 6</div><div class="disabled">缺货</div>
          <div class="head">数量</div><div class="qty">− 3 +</div><div class="qty">− 5 +</div><div class="qty">− 4 +</div><div class="disabled">—</div>
        </div>
        <p class="next-tier">已满足起订量，再选 18 件可享 ¥155 / 件</p>
      </section>
    </main>
    <div class="sticky-bar">
      <div class="sticky-total"><span>已选 12 件</span><strong>¥2,028</strong></div>
      <a class="primary-btn" href="cart.html">加入订货车</a>
    </div>
  </div>
</body>
</html>
