<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>序章订货 - 商品列表</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main class="screen">
      <div class="status"><span>9:41</span><span class="status-icons">● ◒ ▰</span></div>
      <header class="topbar">
        <a class="back-btn" href="home.html">‹</a>
        <div><p class="eyebrow">COLLECTION</p><h1 class="page-title">全部商品</h1></div>
        <a class="icon-btn" href="cart.html">袋</a>
      </header>
      <div class="search">⌕ <span>搜索商品名称 / 货号</span></div>
      <section class="section">
        <div class="chips">
          <span class="chip active">全部</span><span class="chip">外套</span><span class="chip">针织</span><span class="chip">衬衫</span><span class="chip">裙装</span>
        </div>
      </section>
      <div class="filterbar">
        <span class="chip">综合排序⌄</span><span class="chip">价格⌄</span><span class="chip">库存⌄</span><span class="chip">筛选</span>
      </div>
      <section class="section">
        <div class="section-head"><h2>秋季通勤</h2><span class="text-link">共 32 款</span></div>
        <div class="product-grid">
          <a class="product-card" href="product.html">
            <div class="product-image"><img src="assets/coat.png" alt="羊毛混纺收腰大衣"><span class="badge">NEW</span><span class="stock-badge">充足</span></div>
            <h3>羊毛混纺收腰大衣</h3><div class="product-meta"><span class="price"><small>¥</small>169</span><span class="minimum">12件起</span></div>
          </a>
          <a class="product-card" href="product.html">
            <div class="product-image"><img src="assets/knit.png" alt="柔绒针织开衫"><span class="stock-badge">余 42</span></div>
            <h3>柔绒 V 领针织开衫</h3><div class="product-meta"><span class="price"><small>¥</small>118</span><span class="minimum">10件起</span></div>
          </a>
          <a class="product-card" href="product.html">
            <div class="product-image"><img src="assets/suit.png" alt="廓形西装套装"><span class="badge">TOP</span><span class="stock-badge">充足</span></div>
            <h3>都市廓形西装套装</h3><div class="product-meta"><span class="price"><small>¥</small>225</span><span class="minimum">8件起</span></div>
          </a>
          <a class="product-card" href="product.html">
            <div class="product-image"><img src="assets/blouse.png" alt="真丝感衬衫"><span class="stock-badge">低库存</span></div>
            <h3>真丝感垂顺衬衫</h3><div class="product-meta"><span class="price"><small>¥</small>96</span><span class="minimum">12件起</span></div>
          </a>
          <a class="product-card" href="product.html">
            <div class="product-image"><img src="assets/dress.png" alt="收腰通勤连衣裙"></div>
            <h3>收腰通勤连衣裙</h3><div class="product-meta"><span class="price"><small>¥</small>139</span><span class="minimum">10件起</span></div>
          </a>
          <a class="product-card" href="product.html">
            <div class="product-image"><img src="assets/jacket.png" alt="短款通勤夹克"><span class="badge">NEW</span></div>
            <h3>短款通勤夹克</h3><div class="product-meta"><span class="price"><small>¥</small>148</span><span class="minimum">12件起</span></div>
          </a>
        </div>
      </section>
    </main>
    <nav class="bottom-nav">
      <a class="nav-item" href="home.html"><b>⌂</b><span>首页</span></a>
      <a class="nav-item active" href="catalog.html"><b>▦</b><span>分类</span></a>
      <a class="nav-item" href="cart.html"><b>▱</b><span>订货车</span></a>
      <a class="nav-item" href="profile.html"><b>○</b><span>我的</span></a>
    </nav>
  </div>
</body>
</html>
